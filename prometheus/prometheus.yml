scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-connect'
    scrape_interval: 10s
    honor_timestamps: true
    static_configs:
      - targets: [ 'connect:5083' ]
        labels:
          env: "dev"
          kafka_connect_cluster_id: "cluster1"
